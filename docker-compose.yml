name: communa

services:
  db:
    build: ./backend/db
    restart: unless-stopped
    environment:
      POSTGRES_DB: communa
      POSTGRES_USER: communa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-communa_dev_password}
    volumes:
      - communa_pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U communa -d communa']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://communa:${POSTGRES_PASSWORD:-communa_dev_password}@db:5432/communa
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@communa.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-Society Admin}
      PORT: 4000
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  communa_pg_data:
